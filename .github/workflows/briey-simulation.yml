name: Briey Simulation

on:
  push:
    paths:
      - 'Briey/*.v'
      - 'Briey/*.sv'
      - 'Briey/*.bin'
      - 'Briey/action.sh'
      - '.github/workflows/briey-simulation.yml'
  pull_request:
    paths:
      - 'Briey/*.v'
      - 'Briey/*.sv'
      - 'Briey/*.bin'
      - 'Briey/action.sh'
      - '.github/workflows/briey-simulation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Briey simulation
        run: bash Briey/action.sh

