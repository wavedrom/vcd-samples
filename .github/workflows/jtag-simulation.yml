name: JTAG Simulation

on:
  push:
    paths:
      - 'jtag/*.v'
      - 'jtag/action.sh'
      - '.github/workflows/jtag-simulation.yml'
  pull_request:
    paths:
      - 'jtag/*.v'
      - 'jtag/action.sh'
      - '.github/workflows/jtag-simulation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run JTAG simulation
        run: bash jtag/action.sh
